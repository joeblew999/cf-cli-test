# A developer's menu for Cloudflare's new `cf` CLI (https://github.com/cloudflare/cf, open beta):
# only what a dev needs from its ~3,000 commands, each task tested. Findings: FINDINGS.md, findings/.
#
# Every task runs the cf pinned by one project, PROJECT (default app/, made by `mise run new app`).
# MODE picks the config branch (ctx.mode): dev defaults to development, build/deploy to production.
#   PROJECT=other MODE=staging mise run deploy
# Tasks by area: tasks/project.toml (local loop), release.toml (deploy, versions, logs),
# secrets.toml, data.toml (D1/KV/R2 by name), local.toml (dev server data), cli.toml,
# account.toml (resources, cleanup), verify.toml (re-run the evaluation when cf changes).

[tools]
node = "26.10.0"
# cf itself, on PATH as plain `cf` (its intended global install; agents call `cf ...`).
"npm:cf" = "1.0.0-beta.5"

[env]
PROJECT = "{{ get_env(name='PROJECT', default='app') }}"
PORT = "{{ get_env(name='PORT', default='5173') }}"
# Optional: an API token instead of the 1-hour OAuth login (cf reads these; keep them out of git).
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

[task_config]
includes = [
  "tasks/project.toml",
  "tasks/release.toml",
  "tasks/secrets.toml",
  "tasks/data.toml",
  "tasks/local.toml",
  "tasks/cli.toml",
  "tasks/account.toml",
  "tasks/verify.toml",
  "tasks/mcp.toml",
  "tasks/sdk.toml",
]
