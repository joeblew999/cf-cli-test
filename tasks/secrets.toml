# Worker secrets (REMOTE) on PROJECT's Worker in MODE. Local secrets live in .dev.vars[.<MODE>] and are
# never uploaded; remote ones in .secrets/<MODE>.env (gitignored). cf's secret commands don't read the
# config, so the Worker name comes from `cf build --mode` (or WORKER=).

["secret:ls"]
description = "REMOTE, read only: secret names on the Worker"
dir = "{{config_root}}/{{env.PROJECT}}"
run = './node_modules/.bin/cf workers secrets list --worker "$(node {{config_root}}/scripts/cfx.mjs worker)"'

["secret:put"]
description = "REMOTE: set one secret from stdin: printf %s \"$VALUE\" | mise run secret:put NAME"
dir = "{{config_root}}/{{env.PROJECT}}"
usage = 'arg "<name>"'
run = './node_modules/.bin/cf workers secrets update "$usage_name" --type secret_text --worker "$(node {{config_root}}/scripts/cfx.mjs worker </dev/null)"'

["secret:rm"]
description = "REMOTE: delete one secret (without --force cf prints Aborted. and exits 0)"
dir = "{{config_root}}/{{env.PROJECT}}"
usage = 'arg "<name>"'
run = 'W="$(node {{config_root}}/scripts/cfx.mjs worker)" && ./node_modules/.bin/cf workers secrets delete "$usage_name" --force --worker "$W" && echo "deleted $usage_name from $W"'

["secret:push"]
description = "REMOTE: upload every KEY=value in .secrets/<MODE>.env as one new version"
dir = "{{config_root}}/{{env.PROJECT}}"
run = """
set -euo pipefail
F=".secrets/${MODE:-production}.env"
# cf's documented bulk shape {"NAME":{…}} returns 200 and changes nothing: only {"secrets":{…}} works.
BODY=$(node -e 'const s={};for(const l of require("fs").readFileSync(process.argv[1],"utf8").split("\\n")){const m=l.match(/^\\s*([A-Za-z_][A-Za-z0-9_]*)\\s*=\\s*(.*)$/);if(m)s[m[1]]={type:"secret_text",text:m[2].replace(/^(["\\x27])(.*)\\1$/,"$2")}}console.log(JSON.stringify({secrets:s}))' "$F")
W="$(node {{config_root}}/scripts/cfx.mjs worker)"
./node_modules/.bin/cf workers secrets bulk --worker "$W" --body "$BODY" >/dev/null
echo "pushed $(grep -cE '^[A-Za-z_]' "$F") secret(s) from $F to $W"
"""
