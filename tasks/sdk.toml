# SDKs, a CLI and a docs site from OpenAPI specs with Fern (the generators Cloudflare's own Forge is
# built on; Forge itself isn't used, only its spec of the Cloudflare API in sdk:cloudflare).
# sdk/fern/ is a standard Fern project: each API is sdk/fern/apis/<api>/ with its
# openapi.json and a generators.yml holding one group per language and its options. These tasks only
# call Fern's own commands. Needs Docker. See sdk/README.md. Start: mise run sdk:doctor

["sdk:doctor"]
description = "Check what forge needs: its npm install, Docker, Go, FERN_TOKEN, leftover containers"
run = '''
ok() { printf '  ok    %s\n' "$1"; }; warn() { printf '  WARN  %s\n' "$1"; }; bad() { printf '  FAIL  %s\n' "$1"; failed=1; }
failed=0
[ -x sdk/node_modules/.bin/fern ] && ok "fern $(sdk/node_modules/.bin/fern --version | tail -1)" || bad "not installed: mise run sdk:install"
docker info >/dev/null 2>&1 && ok "docker running" || bad "docker not running: start Docker"
command -v go >/dev/null && ok "$(go version | cut -d' ' -f3) (for sdk:check on Go SDKs)" || warn "no go: Go SDKs can't be checked"
[ -n "${FERN_TOKEN:-}" ] && ok "FERN_TOKEN set" || warn "FERN_TOKEN not set: Fern documents local generation as an Enterprise feature needing it (it ran without one on 2026-09-29)"
left=$(docker ps -q --filter ancestor=wiremock/wiremock:3.9.1 2>/dev/null | wc -l | tr -d ' ')
[ "$left" = 0 ] && ok "no leftover WireMock containers" || warn "$left WireMock container(s) running: mise run sdk:clean"
echo "APIs: $(ls sdk/fern/apis | tr '\n' ' ')"
exit $failed
'''

["sdk:install"]
description = "Install Fern (the fern-api CLI) and the TypeScript toolchain into sdk/node_modules"
dir = "{{config_root}}/sdk"
run = "npm install --no-fund --no-audit"

["sdk:list"]
description = "List the APIs in sdk/fern/apis and the SDK groups each one defines"
run = '''
for api in sdk/fern/apis/*/; do
  name=$(basename "$api")
  echo "$name: $(node -e 'const y=require("fs").readFileSync(process.argv[1],"utf8");const m=y.split(/^groups:/m)[1]??"";console.log([...m.matchAll(/^  ([\w-]+):/gm)].map(x=>x[1]).join(" "))' "$api/generators.yml")"
done
'''

["sdk:check-spec"]
description = "Validate an API's spec and config with Fern (fern check): mise run sdk:check-spec <api>"
usage = 'arg "<api>" help="a folder in sdk/fern/apis"'
dir = "{{config_root}}/sdk"
run = './node_modules/.bin/fern check --api "$usage_api" --warnings'

["sdk:gen"]
description = "Generate an SDK with Fern (fern generate --local): mise run sdk:gen <api> <group> -> sdk/out/<api>/<group>"
usage = '''
arg "<api>" help="a folder in sdk/fern/apis"
arg "<group>" help="a group in its generators.yml, e.g. go, typescript, python"
'''
dir = "{{config_root}}/sdk"
run = '''
docker info >/dev/null 2>&1 || { echo "Docker is not running: start it first." >&2; exit 1; }
./node_modules/.bin/fern generate --local --api "$usage_api" --group "$usage_group" --force --log-level warn
'''


["sdk:check"]
description = "Prove a generated SDK works: Go = build + vet + its tests against Fern's WireMock mock; TypeScript = typecheck. mise run sdk:check <dir>"
usage = 'arg "<dir>" help="a directory made by sdk:gen, e.g. sdk/out/petstore/go"'
run = '''
set -euo pipefail
dir="$usage_dir"
if [ -f "$dir/go.mod" ]; then
  (cd "$dir" && go build ./... && echo "build ok" && go vet ./... && echo "vet ok")
  compose="$dir/wiremock/docker-compose.test.yml"
  if [ -f "$compose" ]; then
    docker compose -f "$compose" up -d --wait >/dev/null 2>&1
    trap 'docker compose -f "$compose" down >/dev/null 2>&1' EXIT
    # WireMock gets a random host port: tell the tests where it is.
    export WIREMOCK_URL="http://$(docker compose -f "$compose" port wiremock 8080)"
  fi
  (cd "$dir" && go test ./... >/dev/null && echo "tests ok")
else
  entry=""
  for f in "$dir/index.ts" "$dir/src/index.ts" "$dir/sdk/index.ts"; do [ -f "$f" ] && { entry="$f"; break; }; done
  [ -n "$entry" ] || { echo "$dir: no go.mod or index.ts" >&2; exit 1; }
  # A tsconfig beside the SDK that extends sdk/tsconfig.base.json (standard fetch, no Node types).
  printf '{ "extends": "%s", "include": ["%s"] }
' "$PWD/sdk/tsconfig.base.json" "$(basename "$entry")" > "$(dirname "$entry")/tsconfig.check.json"
  sdk/node_modules/.bin/tsc -p "$(dirname "$entry")/tsconfig.check.json"
  echo "typecheck ok ($entry)"
fi
'''

["sdk:demo"]
description = "Small end-to-end run: Go + TypeScript SDKs for the petstore API, checked"
run = '''
set -euo pipefail
for group in go typescript; do
  mise run -q sdk:gen petstore "$group"
  mise run -q sdk:check "sdk/out/petstore/$group"
done
'''

["sdk:cloudflare"]
description = "HEAVY (26 MB spec, minutes of Docker): add Cloudflare products as an API (sdk/fern/apis/cloudflare), sliced from Forge's spec of the whole API: mise run sdk:cloudflare [--products d1,kv]"
usage = '''
flag "--products <list>" default="d1,kv" help="comma-separated: workers, d1, kv, r2, queues, workflows, ..."
flag "--release <sha>" default="6b0fb3cd63aca815f1667a8fa908114886867dc6" help="Forge openapi release (default: the one cf 1.0.0-beta.5 uses)"
'''
run = '''
set -euo pipefail
full=".forge/$usage_release.json"
api=sdk/fern/apis/cloudflare
mkdir -p .forge "$api"
[ -f "$full" ] || curl -fsSL -o "$full" "https://github.com/cloudflare/forge/releases/download/openapi@$usage_release/openapi.forge.json"
# Keep the account-level paths of the chosen products ("kv" lives under /storage/kv).
node -e '
const [file, out, products] = process.argv.slice(1);
const spec = JSON.parse(require("fs").readFileSync(file, "utf8"));
const prefixes = products.split(",").map(p => ({ kv: "storage/kv", r2: "r2/buckets" })[p] ?? p);
spec.paths = Object.fromEntries(Object.entries(spec.paths).filter(([p]) => prefixes.some(x => p.startsWith(`/accounts/{account_id}/${x}`))));
let ops = 0; for (const item of Object.values(spec.paths)) for (const m of ["get","put","post","delete","patch"]) if (item[m]) ops++;
require("fs").writeFileSync(out, JSON.stringify(spec));
console.log(`${out}: ${ops} operations (${products})`);
' "$full" "$api/openapi.json" "$usage_products"
[ -f "$api/generators.yml" ] || sed -e 's|/petstore/|/cloudflare/|g; s|example.com/petstore|example.com/cloudflare|; s|packageName: petstore|packageName: cloudflare|; s|namespaceExport: Petstore|namespaceExport: Cloudflare|' sdk/fern/apis/petstore/generators.yml > "$api/generators.yml"
echo "Now: mise run sdk:gen cloudflare go (or typescript, python)"
'''

["sdk:clean"]
description = "Remove generated SDKs (sdk/out) and stop leftover WireMock containers"
run = '''
rm -rf sdk/out sdk/.work
ids=$(docker ps -q --filter ancestor=wiremock/wiremock:3.9.1 2>/dev/null)
[ -n "$ids" ] && docker rm -f $ids >/dev/null && echo "stopped WireMock containers"
echo "clean"
'''

["sdk:docs"]
description = "Preview the API docs site for all APIs locally (fern docs dev, sdk/fern/docs.yml): http://localhost:3030"
dir = "{{config_root}}/sdk"
# Fern installs its preview app in ~/.fern/app-preview and runs pnpm/node there, outside this repo:
# tell mise's shims which node to use for those child processes too.
env = { MISE_NODE_VERSION = "26" }
run = "./node_modules/.bin/fern docs dev --port 3030"

# --- the TypeScript SDK on Cloudflare Workers (sdk/harness: a Worker made with `mise run new`) ---
# It implements the showcase API itself (/api/mock/*) and /api/sdk-test runs the generated SDK against it
# inside workerd: pagination, OAuth, idempotency, SSE, webhook signatures, and the WebSocket client
# (inside the Worker and from Node) against the Worker's liveNotes channel.

["sdk:harness:sync"]
description = "Copy the compiled showcase TypeScript SDK (group typescript-dist: .js + .d.ts) into the Worker (sdk/harness/src/client)"
run = '''
set -euo pipefail
[ -f sdk/out/showcase/typescript-dist/index.js ] || mise run -q sdk:gen showcase typescript-dist
rm -rf sdk/harness/src/client
cp -R sdk/out/showcase/typescript-dist/esm sdk/harness/src/client
echo "SDK copied into sdk/harness/src/client"
'''

["sdk:harness:test"]
description = "Run the SDK test in the Worker: locally under cf dev (default), or against the deployed Worker with --remote"
usage = 'flag "--remote" help="test the deployed cftest-sdk Worker instead of cf dev"'
run = '''
set -euo pipefail
if [ "${usage_remote:-false}" = true ]; then
  # The URL cf deploy printed, recorded by `mise run deploy` in .cf-manifest.json.
  base=$(node -p 'require("./.cf-manifest.json").find(e => e.kind === "worker" && e.name === "cftest-sdk")?.url ?? ""')
  [ -n "$base" ] || { echo "cftest-sdk not deployed yet: PROJECT=sdk/harness mise run deploy" >&2; exit 1; }
else
  port=5398
  (cd sdk/harness && PORT=$port ./node_modules/.bin/cf dev >/tmp/forge-cf-dev.log 2>&1 &)
  trap 'lsof -ti :'$port' | xargs kill 2>/dev/null' EXIT
  for _ in $(seq 1 40); do curl -s -o /dev/null "localhost:$port/" && break; sleep 1; done
  base="http://localhost:$port"
fi
echo "Target: $base"
report='let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let r;try{r=JSON.parse(s)}catch{console.log(s.slice(0,500));process.exit(1)}for(const [k,v] of Object.entries(r.results))console.log(`${v.ok?"PASS":"FAIL"}  ${k}${v.ok?"":"  "+JSON.stringify(v.detail).slice(0,300)}`);process.exit(r.passed?0:1)})'
failed=0
curl -s "$base/api/sdk-test" | node -e "$report" || failed=1
# WebSockets: the SDK client inside the Worker, and from Node over the network.
target=""
if [ "${usage_remote:-false}" = true ]; then
  # On Cloudflare the in-Worker client needs another Worker to connect to (a Worker can't call itself: error 1042).
  api=$(node -p 'require("./.cf-manifest.json").find(e => e.kind === "worker" && e.name === "cftest-sdk-api")?.url ?? ""')
  [ -n "$api" ] || { echo "deploy the api copy first: PROJECT=sdk/harness MODE=api mise run deploy" >&2; exit 1; }
  target="?target=$api"
fi
curl -s "$base/api/ws-test$target" | node -e "$report" || failed=1
node sdk/harness/ws-client.mjs "$base" || failed=1
exit $failed
'''

# --- Fern's CLI generator: a Rust CLI for an API (group `cli` in generators.yml, output e.g. sdk/out/petstore/cli) ---
# Early access per Fern's docs, but it generated locally without a FERN_TOKEN (2026-09-29).
# Building is HEAVY the first time (compiles all Rust dependencies: minutes at full CPU).
# Platforms: Linux in Docker (these tasks); macOS natively on a Mac; all 7 targets in the generated
# dist-workspace.toml (macOS, Linux gnu/musl, Windows msvc) via cargo-dist on GitHub Actions.

["sdk:cli:build:linux"]
description = "HEAVY: build a generated Rust CLI for Linux inside Docker (rust image; the container's arch, arm64 on Apple Silicon): mise run sdk:cli:build:linux <dir>"
usage = 'arg "<dir>" help="a CLI made by sdk:gen, e.g. sdk/out/petstore/cli"'
run = '''
set -euo pipefail
dir="$(cd "$usage_dir" && pwd)"
bin=$(awk '/^\[\[bin\]\]/{f=1} f&&/^name/{gsub(/"/,"",$3);print $3;exit}' "$dir/Cargo.toml")
docker info >/dev/null 2>&1 || { echo "Docker is not running" >&2; exit 1; }
# Named volumes cache crates and build output between runs; target-linux keeps it apart from a macOS build.
docker run --rm -v "$dir":/src -w /src -v forge-cargo-registry:/usr/local/cargo/registry -e CARGO_TARGET_DIR=/src/target-linux rust:1 \
  cargo build --release --bin "$bin" --no-default-features --features rustls
echo "built: $usage_dir/target-linux/release/$bin (Linux)"
'''

["sdk:cli:build:mac"]
description = "HEAVY: build a generated Rust CLI natively for this Mac (needs Rust: mise use rust): mise run sdk:cli:build:mac <dir>"
usage = 'arg "<dir>" help="a CLI made by sdk:gen, e.g. sdk/out/petstore/cli"'
dir = "{{config_root}}"
run = '''
set -euo pipefail
cd "$usage_dir"
cargo --version >/dev/null 2>&1 || { echo "Rust is not installed: mise use rust (or rustup)" >&2; exit 1; }
bin=$(awk '/^\[\[bin\]\]/{f=1} f&&/^name/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)
cargo build --release --bin "$bin" --no-default-features --features rustls
echo "built: $usage_dir/target/release/$bin (macOS)"
'''

["sdk:harness:deploy"]
description = "REMOTE: deploy the SDK test Worker twice with cf: cftest-sdk and cftest-sdk-api (--mode api, what the in-Worker WebSocket test connects to); both recorded for cleanup"
run = '''
set -euo pipefail
mise run -q sdk:harness:sync
for mode in production api; do PROJECT=sdk/harness MODE=$mode mise run -q deploy | grep -E 'recorded|https://'; done
'''

# --- api/: an oRPC Worker (contract first) as the spec source ---

["api:spec"]
description = "Write the oRPC API's OpenAPI and AsyncAPI specs from its contract (api/src/contract.ts) into sdk/fern/apis/api/{openapi,asyncapi}.json, with the deployed URL as their server"
dir = "{{config_root}}/api"
run = '''
url=$(node -p 'require("../.cf-manifest.json").find(e => e.kind === "worker" && e.name === "cftest-api")?.url ?? "https://api.example.com"' 2>/dev/null || echo https://api.example.com)
node spec.ts ../sdk/fern/apis/api/openapi.json ../sdk/fern/apis/api/asyncapi.json "$url"
'''

["api:check"]
description = "LOCAL: the oRPC API's checks: typecheck, unit tests (follow()), and both committed specs (sdk/fern/apis/api/{openapi,asyncapi}.json) match the contract"
dir = "{{config_root}}/api"
run = '''
set -euo pipefail
npm run -s typecheck >/dev/null && echo "typecheck ok"
npx vitest run >/dev/null && echo "unit tests ok"
url=$(node -p 'require("../.cf-manifest.json").find(e => e.kind === "worker" && e.name === "cftest-api")?.url ?? "https://api.example.com"' 2>/dev/null || echo https://api.example.com)
tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
node spec.ts "$tmp/openapi.json" "$tmp/asyncapi.json" "$url" >/dev/null
for f in openapi asyncapi; do
  diff -q "$tmp/$f.json" "../sdk/fern/apis/api/$f.json" >/dev/null || { echo "sdk/fern/apis/api/$f.json is stale: run mise run api:spec" >&2; exit 1; }
done
echo "specs match the contract"
'''

["api:test"]
description = "Unit tests for the API (api/test: follow(), the one real-time feed)"
dir = "{{config_root}}/api"
run = "npx vitest run"

["api:soak"]
description = "REMOTE, redeploys cftest-api and writes test notes: the real-time matrix (every client x scenario: planned end, hub restart, client drop). --idle <min> for the long-idle case. Extra args reach api/soak.mjs"
raw_args = true
run = '''
soak() {
  url=$(node -p 'require("./.cf-manifest.json").find(e => e.kind === "worker" && e.name === "cftest-api")?.url ?? ""')
  [ -n "$url" ] || { echo "deploy first: PROJECT=api mise run deploy" >&2; exit 1; }
  node api/soak.mjs "$url" "$@"
}; soak'''

["api:live-test"]
description = "REMOTE, read + writes test notes: the API's real-time paths on the deployed Worker. Raw SSE + WebSocket clients, then the generated TypeScript SDK (notes.watch, liveNotes.connect); a created note must reach all of them via the NotesHub Durable Object"
run = '''
set -uo pipefail
url=$(node -p 'require("./.cf-manifest.json").find(e => e.kind === "worker" && e.name === "cftest-api")?.url ?? ""')
[ -n "$url" ] || { echo "deploy first: PROJECT=api mise run deploy" >&2; exit 1; }
[ -f sdk/out/api/typescript-dist/esm/index.mjs ] || mise run -q sdk:gen api typescript-dist
failed=0
node api/live-test.mjs "$url" || failed=1
node api/sdk-live-test.mjs "$url" || failed=1
exit $failed
'''
