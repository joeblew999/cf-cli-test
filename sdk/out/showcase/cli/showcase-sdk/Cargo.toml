[package]
name = "showcase_sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for showcase_sdk generated by Fern"
license = "MIT"
repository = "https://github.com/fern-api/fern"
documentation = "https://docs.rs/showcase_sdk"

[lib]
doctest = false

[dependencies]
base64 = "0.22"
bytes = "1.0"
futures = "0.3"
hmac = "0.12"
pin-project = { version = "1.1", optional = true }
reqwest = { version = "0.12", features = ["json", "stream", "gzip"], default-features = false }
reqwest-sse = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
url = "2.5"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["multipart", "sse"]
multipart = ["reqwest/multipart"]
sse = ["reqwest-sse", "pin-project"]

[dependencies.showcase_types]
path = "../showcase-types"
