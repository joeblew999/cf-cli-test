[package]
name = "cftest_api_sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for cftest_api_sdk generated by Fern"
license = "MIT"
repository = "https://github.com/fern-api/fern"
documentation = "https://docs.rs/cftest_api_sdk"

[lib]
doctest = false

[dependencies]
bytes = "1.0"
futures = "0.3"
pin-project = { version = "1.1", optional = true }
reqwest = { version = "0.12", features = ["json", "stream", "gzip"], default-features = false }
reqwest-sse = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["sse"]
sse = ["reqwest-sse", "pin-project"]

[dependencies.cftest_api_types]
path = "../cftest-api-types"
