# The WebSocket channel (written by hand: oRPC generates OpenAPI only). /api/notes/live is held by the
# NotesHub Durable Object; every new note is pushed to all connected clients.
asyncapi: 3.0.0
info:
  title: cftest-api live
  version: 1.0.0
servers:
  production:
    host: cftest-api.gedw99.workers.dev
    protocol: wss
channels:
  liveNotes:
    address: /api/notes/live
    messages:
      Note:
        $ref: '#/components/messages/Note'
operations:
  receiveNote:
    action: receive
    channel:
      $ref: '#/channels/liveNotes'
    messages:
      - $ref: '#/channels/liveNotes/messages/Note'
components:
  messages:
    Note:
      payload:
        type: object
        required: [id, body, created_at]
        properties:
          id:
            type: integer
          body:
            type: string
          created_at:
            type: string
