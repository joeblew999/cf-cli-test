# The oRPC Worker in api/: openapi.json is written by `mise run api:spec` (never by hand); what oRPC
# needs (SDK names, x-fern-pagination, x-fern-streaming) is declared in the contract itself; only the
# WebSocket channel is written by hand, in asyncapi.yml (oRPC generates OpenAPI, not AsyncAPI).
# Generate: mise run sdk:gen api <group>
api:
  specs:
    - openapi: openapi.json
    - asyncapi: asyncapi.yml

groups:
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.64.0
        output:
          location: local-file-system
          path: ../../../out/api/go
        config:
          module:
            path: example.com/cftestapi
            version: "1.22"
          packageName: cftestapi

  typescript:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../../../out/api/typescript
        config:
          namespaceExport: CftestApi
          guardProcessEnvAccess: true
          generateWebSocketClients: true

  cli:
    generators:
      - name: fernapi/fern-cli-generator
        version: 0.44.0
        output:
          location: local-file-system
          path: ../../../out/api/cli
        config:
          binaryName: cftest-api

  # Compiled (.js + .d.ts): what a Worker or Node app imports; api/sdk-live-test.mjs uses it.
  typescript-dist:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.98.0
        output:
          location: local-file-system
          path: ../../../out/api/typescript-dist
        config:
          namespaceExport: CftestApi
          guardProcessEnvAccess: true
          generateWebSocketClients: true
          outputSourceFiles: false
